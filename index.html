<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BarberSaaS · Sua agenda online</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--card:#151e2b;--line:#2a3748;--muted:#aebccc;--gold:#ffc45e;--green:#6fe0b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f9fc;font:16px/1.55 system-ui,sans-serif}header{padding:16px max(20px,calc((100% - 1100px)/2));border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}header a{text-decoration:none;color:inherit}.brand{font-weight:800;font-size:20px}.tag{font-size:12px;color:var(--muted)}main{max-width:1100px;margin:auto;padding:32px 20px 60px}h1{font-size:clamp(28px,4vw,46px);line-height:1.15;letter-spacing:-1px}h2{font-size:23px;line-height:1.3}h3{font-size:17px}.muted,small{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);padding:24px;border-radius:18px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:12px}label{display:block;margin-bottom:12px;font-size:14px;font-weight:600}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid var(--line);background:#0d1520;color:#fff;border-radius:9px;font:inherit;margin-top:6px}input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}input[type=checkbox]{width:auto;margin:0}button,.button{display:inline-flex;justify-content:center;align-items:center;padding:11px 18px;background:var(--gold);color:#172030;border:0;border-radius:10px;font:600 14px system-ui;cursor:pointer;text-decoration:none}button:disabled{opacity:.45;cursor:wait}.secondary{background:#243145;color:#fff}.danger{background:#4c2732;color:#ffd0d9}.success{color:var(--green)}.wide{width:100%}.hidden{display:none!important}.narrow{max-width:470px;margin:20px auto}.notice{padding:14px 18px;background:#253246;border-radius:10px;margin-bottom:20px}.error{background:#422332;color:#ffd6df}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.active{background:var(--gold);color:#172030}.price{font-size:26px;font-weight:750}.item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}.item p{margin:4px 0}.badge{font-size:12px;padding:4px 10px;background:#293951;border-radius:20px}.entry{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:14px}.entry label{margin:0}.barber-entry{grid-template-columns:1fr 1fr auto}.hero{max-width:740px;padding:35px 0}.hero p{font-size:19px;max-width:620px;color:var(--muted)}.days label{display:flex;align-items:center;gap:6px;margin:0}.linkbox{word-break:break-all;color:var(--gold)}footer{color:var(--muted);font-size:13px;text-align:center;padding:20px;border-top:1px solid var(--line)}@media(max-width:700px){.grid,.metrics{grid-template-columns:1fr}.entry{grid-template-columns:1fr 1fr}.entry label:first-child{grid-column:1/-1}.barber-entry{grid-template-columns:1fr auto}.card{padding:18px}header{align-items:flex-start}.hero{padding:8px 0}main{padding-top:24px}} 
</style></head>
<body><header><a class="brand" href="/">💈 BarberSaaS</a><a class="button secondary" href="/entrar">Área da barbearia</a></header>
<main><div id="mensagem" class="notice hidden" role="status" aria-live="polite"></div><div id="conteudo"><p>Carregando…</p></div></main>
<footer>Agendamento online · Horário de Brasília</footer>
<script>
const el=document.getElementById('conteudo');
let assinaturaInfo=null;
let csrf='', sessao=null, config=null, reservas=[], slug='', abaAtual='agenda', versaoHorarios=0;
const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function mensagem(texto,erro=false){const m=document.getElementById('mensagem');m.textContent=texto;m.className='notice'+(erro?' error':'');m.scrollIntoView({behavior:'smooth',block:'nearest'});}
function limparMensagem(){document.getElementById('mensagem').className='hidden';}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...options.headers}});const data=await r.json().catch(()=>({}));if(!r.ok){const error=new Error(typeof data.detail==='string'?data.detail:'Confira os campos preenchidos.');error.status=r.status;throw error;}return data;}
function inicio(){el.innerHTML=`<section class="hero"><span class="badge">Sua barbearia, sua agenda</span><h1>Organize os atendimentos.<br>Deixe o cliente agendar.</h1><p>Crie sua conta, cadastre serviços e profissionais e compartilhe o link da sua barbearia. Altere preços e horários quando precisar.</p><div class="row"><a class="button" href="/cadastro">Criar minha barbearia</a><a class="button secondary" href="/entrar">Já tenho uma conta</a></div></section><div class="grid"><div class="card"><h2>Um link para seus clientes</h2><p class="muted">O cliente escolhe serviço, profissional e horário. A reserva entra na sua agenda.</p></div><div class="card"><h2>Um painel para você</h2><p class="muted">Configure seu negócio, acompanhe reservas, conclua atendimentos e confira os valores.</p></div></div><p class="muted">Já agendou antes? Use o link enviado pela sua barbearia. <a class="success" href="/b/barbearia">Ver demonstração</a>.</p>`;}
function acesso(cadastro=false){el.innerHTML=`<section class="card narrow"><h1 style="font-size:30px">${cadastro?'Crie sua barbearia':'Entre na sua conta'}</h1><p class="muted">${cadastro?'R$ 90 por mês por barbearia. Configure sua conta e pague via Pix. A agenda será liberada após a conferência do pagamento.':'Acesse sua agenda e as configurações.'}</p><form id="form-acesso">${cadastro?'<label>Nome da barbearia<input name="nome" required minlength="2" maxlength="100" autocomplete="organization"></label><label>Endereço da sua barbearia<input name="slug" required minlength="3" maxlength="50" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="exemplo: barbearia-do-joao"><small>Use letras minúsculas, números e hífens. Esse será o final do seu link.</small></label>':''}<label>E-mail<input name="email" type="email" required maxlength="150" autocomplete="email"></label><label>Senha<input name="senha" type="password" required minlength="10" maxlength="128" autocomplete="${cadastro?'new-password':'current-password'}"><small>Pelo menos 10 caracteres.</small></label><button class="wide" type="submit">${cadastro?'Criar conta':'Entrar'}</button></form><p class="muted">${cadastro?'Já tem uma conta? <a class="success" href="/entrar">Entre aqui</a>.':'Ainda não tem conta? <a class="success" href="/cadastro">Cadastre sua barbearia</a>.'}</p></section>`;
document.getElementById('form-acesso').onsubmit=async e=>{e.preventDefault();limparMensagem();const form=e.target,b=form.querySelector('button');b.disabled=true;try{const body=Object.fromEntries(new FormData(form));await api(cadastro?'/api/cadastro':'/api/login',{method:'POST',body:JSON.stringify(body)});location.href='/painel';}catch(err){mensagem(err.message,true);b.disabled=false;}};}
async function booking(){config=await api('/api/publico/'+encodeURIComponent(slug)+'/configuracao');document.title=config.nome+' · Agendamento';if(config.agenda_liberada===false){el.innerHTML=`<div class="card"><h1>${esc(config.nome)}</h1><p>Esta agenda está temporariamente indisponível. Entre em contato com a barbearia.</p>${config.whatsapp?`<a class="button" href="${wa(config.whatsapp)}">Falar com a barbearia</a>`:''}</div>`;return;}if(!config.servicos.length||!config.barbeiros.length){el.innerHTML=`<div class="card"><h1>${esc(config.nome)}</h1><p>Esta barbearia ainda está preparando a agenda. Volte em breve.</p></div>`;return;}
el.innerHTML=`<h1>${esc(config.nome)}</h1><p class="muted">Escolha seu serviço e reserve um horário.</p><div class="grid"><form id="reserva" class="card"><label>Serviço<select id="servico" name="servico_id">${config.servicos.map(s=>`<option value="${esc(s.id)}">${esc(s.nome)} · ${money(s.preco)} · ${s.duracao} min</option>`).join('')}</select></label><label>Profissional<select id="barbeiro" name="barbeiro_id">${config.barbeiros.map(b=>`<option value="${esc(b.id)}">${esc(b.nome)}</option>`).join('')}</select></label><div class="grid"><label>Data<input type="date" id="data" name="data" required min="${today()}" value="${today()}"></label><label>Horário<select id="horario" name="horario" required disabled><option>Consultando…</option></select></label></div><label>Seu nome<input name="cliente_nome" autocomplete="name" required minlength="2" maxlength="100"></label><label>Seu WhatsApp com DDD<input name="cliente_telefone" type="tel" autocomplete="tel" required maxlength="25" placeholder="(11) 99999-9999"></label><small>Seus dados serão usados pela barbearia para organizar o atendimento e falar com você sobre a reserva.</small><button id="agendar" class="wide" style="margin-top:18px" disabled>Confirmar agendamento</button></form><aside><div class="card"><h2>Seu atendimento</h2><p id="resumo-servico"></p><p id="resumo-profissional" class="muted"></p><p id="resumo-preco" class="price success"></p><p class="muted">Precisa cancelar ou reagendar? Fale com a barbearia.${config.whatsapp?` <a class="success" target="_blank" rel="noopener" href="${wa(config.whatsapp)}">Abrir WhatsApp</a>.`:''}</p></div><div id="confirmacao" class="card hidden" role="status"></div></aside></div>`;
['servico','barbeiro','data'].forEach(id=>document.getElementById(id).onchange=horarios);
document.getElementById('reserva').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('agendar');b.disabled=true;limparMensagem();try{const body=Object.fromEntries(new FormData(e.target));const r=await api('/api/publico/'+encodeURIComponent(slug)+'/agendamentos',{method:'POST',body:JSON.stringify(body)});const c=document.getElementById('confirmacao');c.className='card';c.innerHTML=`<h2 class="success">Agendamento confirmado</h2><p>Reserva #${r.agendamento_id}: ${esc(body.data.split('-').reverse().join('/'))} às ${esc(body.horario)}.</p><p>Valor: <strong>${money(r.preco)}</strong></p>${r.link_whatsapp?`<a class="button secondary" href="${esc(r.link_whatsapp)}" target="_blank" rel="noopener">${r.whatsapp_destinatario==='barbeiro'?'Avisar o barbeiro no WhatsApp':'Avisar a barbearia no WhatsApp'}</a><p class="muted">A mensagem precisa ser enviada por você.</p>`:''}`;e.target.cliente_nome.value='';e.target.cliente_telefone.value='';c.scrollIntoView({behavior:'smooth'});}catch(err){mensagem(err.message+' Se a conexão caiu, confira com a barbearia antes de tentar novamente.',true);}finally{await horarios();}};
await horarios();}
function wa(phone){let p=String(phone).replace(/\D/g,'');if(p.length===10||p.length===11)p='55'+p;return 'https://wa.me/'+p;}
async function horarios(){const version=++versaoHorarios,select=document.getElementById('horario'),b=document.getElementById('agendar');const old=select.value;select.disabled=true;b.disabled=true;select.replaceChildren(new Option('Consultando…',''));const sid=document.getElementById('servico').value,bid=document.getElementById('barbeiro').value,s=config.servicos.find(x=>x.id===sid);document.getElementById('resumo-servico').textContent=s.nome+' · '+s.duracao+' minutos';document.getElementById('resumo-profissional').textContent=config.barbeiros.find(x=>x.id===bid).nome;document.getElementById('resumo-preco').textContent=money(s.preco);try{const params=new URLSearchParams({data:document.getElementById('data').value,servico_id:sid,barbeiro_id:bid});const r=await api('/api/publico/'+encodeURIComponent(slug)+'/disponibilidade?'+params);if(version!==versaoHorarios)return;select.replaceChildren(...r.horarios.map(h=>new Option(h,h)));if(r.horarios.includes(old))select.value=old;if(!r.horarios.length)select.add(new Option('Sem horários disponíveis',''));select.disabled=!r.horarios.length;b.disabled=!r.horarios.length;}catch(err){if(version!==versaoHorarios)return;select.replaceChildren(new Option('Não foi possível consultar',''));mensagem(err.message,true);}}
async function painel(){try{sessao=await api('/api/sessao');csrf=sessao.csrf;if(sessao.papel==='barbeiro'){await painelBarbeiro();return;}config=await api('/api/configuracao');reservas=await api('/api/agendamentos');assinaturaInfo=await api('/api/assinatura');}catch(err){if(err.status===401){location.replace('/entrar');return;}throw err;}
el.innerHTML=`<div class="row between"><div><h1 id="nome-loja"></h1><p class="muted">Sua agenda e as configurações da barbearia.</p></div><button class="secondary" id="sair">Sair da conta</button></div><div class="card"><strong>Link para os clientes agendarem</strong><p id="link-publico" class="linkbox"></p><div class="row"><a id="abrir-link" class="button secondary" target="_blank" rel="noopener">Abrir minha agenda</a><button id="copiar-link" class="secondary">Copiar link</button></div></div><div id="assinatura-area"></div>${sessao.administrador?'<p><a class="button secondary" href="/gestao">Gerenciar assinaturas</a></p>':''}<nav><button id="aba-agenda" class="active">Agenda</button><button id="aba-config" class="secondary">Configurações</button><button id="aba-equipe" class="secondary">Equipe</button></nav><div id="agenda-area"></div><div id="config-area" class="hidden"></div><div id="equipe-area" class="hidden"></div>`;
renderAssinatura();document.getElementById('nome-loja').textContent=config.nome;const link=location.origin+'/b/'+sessao.slug;document.getElementById('link-publico').textContent=link;document.getElementById('abrir-link').href=link;document.getElementById('copiar-link').onclick=async()=>{try{await navigator.clipboard.writeText(link);mensagem('Link copiado. Envie para seus clientes.');}catch{mensagem('Copie o endereço mostrado acima.');}};document.getElementById('sair').onclick=async()=>{try{await api('/api/logout',{method:'POST'});location.href='/entrar';}catch(err){mensagem(err.message,true);}};
document.getElementById('aba-agenda').onclick=()=>mostrarAba('agenda');document.getElementById('aba-config').onclick=()=>mostrarAba('config');document.getElementById('aba-equipe').onclick=async()=>{mostrarAba('equipe');try{await renderEquipe();}catch(err){mensagem(err.message,true);}};renderAgenda();renderConfig();if(!config.servicos.length||!config.barbeiros.length){mostrarAba('config');mensagem('Cadastre ao menos um profissional e um serviço, confira seus horários e salve para começar.');}
setInterval(async()=>{if(document.hidden||abaAtual!=='agenda')return;try{reservas=await api('/api/agendamentos');listaAgenda();}catch(err){if(err.status===401)location.replace('/entrar');}},30000);}
function mostrarAba(a){abaAtual=a;document.getElementById('equipe-area').classList.toggle('hidden',a!=='equipe');document.getElementById('aba-equipe').className=a==='equipe'?'active':'secondary';document.getElementById('agenda-area').classList.toggle('hidden',a!=='agenda');document.getElementById('config-area').classList.toggle('hidden',a!=='config');document.getElementById('aba-agenda').className=a==='agenda'?'active':'secondary';document.getElementById('aba-config').className=a==='config'?'active':'secondary';}
function renderAgenda(){document.getElementById('agenda-area').innerHTML=`<div class="row between"><h2>Atendimentos</h2><div class="row"><button class="secondary" id="atualizar">Atualizar</button><button class="secondary" id="exportar">Baixar reservas</button></div></div><div class="card"><div class="grid"><label>Data<input type="date" id="filtro-data" value="${today()}"></label><label>Situação<select id="filtro-status"><option value="">Todas</option><option value="agendado">Agendados</option><option value="concluido">Concluídos</option><option value="cancelado">Cancelados</option></select></label></div><button class="secondary" id="todas-datas">Ver todas as datas</button></div><div id="metricas" class="metrics"></div><div id="lista-reservas"></div>`;
document.getElementById('filtro-data').onchange=listaAgenda;document.getElementById('filtro-status').onchange=listaAgenda;document.getElementById('todas-datas').onclick=()=>{document.getElementById('filtro-data').value='';listaAgenda();};document.getElementById('atualizar').onclick=async()=>{try{reservas=await api('/api/agendamentos');listaAgenda();mensagem('Agenda atualizada.');}catch(err){mensagem(err.message,true);}};document.getElementById('exportar').onclick=exportar;listaAgenda();}
function listaAgenda(){const day=document.getElementById('filtro-data').value,status=document.getElementById('filtro-status').value;const rows=reservas.filter(r=>(!day||r.inicio.startsWith(day))&&(!status||r.status===status));const done=rows.filter(r=>r.status==='concluido'),revenue=done.reduce((sum,r)=>sum+Number(r.preco),0),commission=done.reduce((sum,r)=>sum+Number(r.preco)*r.comissao_pct/100,0);document.getElementById('metricas').innerHTML=sessao.papel==='barbeiro'?`<div class="card"><small>Meus atendimentos concluídos</small><p class="price">${done.length}</p></div><div class="card"><small>Minha comissão dos concluídos</small><p class="price success">${money(commission)}</p></div>`:`<div class="card"><small>Receita de concluídos</small><p class="price success">${money(revenue)}</p></div><div class="card"><small>Comissões</small><p class="price">${money(commission)}</p></div><div class="card"><small>Saldo após comissões</small><p class="price">${money(revenue-commission)}</p><small>Outras despesas não descontadas.</small></div>`;
document.getElementById('lista-reservas').innerHTML=rows.length?rows.map(r=>`<div class="item"><div class="row between"><strong>${esc(r.cliente_nome)}</strong><span class="badge">${esc(r.status)}</span></div><p>${esc(r.servico_nome)} · ${money(r.preco)}</p><p class="muted">${esc(r.inicio.slice(0,10).split('-').reverse().join('/'))} às ${esc(r.inicio.slice(11))} · ${esc(r.barbeiro_nome)} · ${r.duracao_minutos} min</p><div class="row" style="margin-top:12px"><a class="button secondary" target="_blank" rel="noopener" href="${wa(r.cliente_telefone)}">WhatsApp</a>${r.status==='agendado'?`<button data-reserva="${r.id}" data-status="concluido">Concluir</button>${sessao.papel==='barbeiro'?'':`<button class="danger" data-reserva="${r.id}" data-status="cancelado">Cancelar</button>`}`:sessao.papel==='barbeiro'?'':`<button class="secondary" data-reserva="${r.id}" data-status="agendado">Reabrir</button>`}</div></div>`).join(''):'<div class="card muted">Nenhum atendimento para esse filtro.</div>';
document.querySelectorAll('[data-reserva]').forEach(b=>b.onclick=async()=>{if(b.dataset.status==='cancelado'&&!confirm('Cancelar esta reserva e liberar o horário?'))return;b.disabled=true;try{await api('/api/agendamentos/'+b.dataset.reserva,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});reservas=await api('/api/agendamentos');listaAgenda();mensagem('Reserva atualizada.');}catch(err){mensagem(err.message,true);b.disabled=false;}});}
function exportar(){const cells=v=>{let text=String(v??'');if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';};const rows=[['Reserva','Cliente','WhatsApp','Serviço','Profissional','Data e hora','Preço','Situação'],...reservas.map(r=>[r.id,r.cliente_nome,r.cliente_telefone,r.servico_nome,r.barbeiro_nome,r.data_hora,r.preco,r.status])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(cells).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reservas-'+sessao.slug+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function idNovo(){return crypto.randomUUID();}
function servicoEntry(s){return `<div class="entry" data-servico="${esc(s.id)}"><label>Serviço<input data-campo="nome" value="${esc(s.nome)}" required minlength="2" maxlength="100"></label><label>Preço (R$)<input data-campo="preco" type="number" value="${s.preco}" min="0.01" max="10000" step="0.01" required></label><label>Duração (min)<input data-campo="duracao" type="number" value="${s.duracao}" min="5" max="480" required></label><button type="button" class="danger remover">Remover</button></div>`;}
function barberEntry(b){return `<div class="entry barber-entry" data-barbeiro="${esc(b.id)}"><label>Nome do profissional<input data-campo="nome" value="${esc(b.nome)}" required minlength="2" maxlength="100"></label><label>WhatsApp do profissional<input data-campo="whatsapp" type="tel" maxlength="25" placeholder="DDD + número" value="${esc(b.whatsapp||'')}"><small>Opcional. Sem número, o aviso vai para a loja.</small></label><button type="button" class="danger remover">Remover</button></div>`;}
function periodEntry(p){return `<div class="entry periodo"><label>Abre às<input data-campo="inicio" type="time" value="${esc(p.inicio)}" required></label><label>Fecha às<input data-campo="fim" type="time" value="${esc(p.fim)}" required></label><button type="button" class="danger remover">Remover</button></div>`;}
function bindRemove(){document.querySelectorAll('.remover').forEach(b=>b.onclick=()=>b.parentElement.remove());}
function renderConfig(){const days=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];document.getElementById('config-area').innerHTML=`<form id="config-form"><div class="card"><h2>Sua barbearia</h2><label>Nome<input name="nome" value="${esc(config.nome)}" required minlength="2" maxlength="100"></label><label>WhatsApp da loja<input name="whatsapp" value="${esc(config.whatsapp)}" type="tel" maxlength="25" placeholder="DDD + número"></label><label>Comissão dos profissionais (%)<input name="comissao" value="${config.comissao}" type="number" min="0" max="100" required></label><small>O percentual fica registrado em cada nova reserva.</small></div><div class="card"><h2>Profissionais</h2><div id="profissionais">${config.barbeiros.map(barberEntry).join('')}</div><button id="add-barbeiro" type="button" class="secondary">Adicionar profissional</button></div><div class="card"><h2>Serviços e preços</h2><div id="servicos">${config.servicos.map(servicoEntry).join('')}</div><button id="add-servico" type="button" class="secondary">Adicionar serviço</button><p class="muted">Alterações valem para novas reservas. Atendimentos já agendados mantêm preço e duração.</p></div><div class="card"><h2>Funcionamento</h2><div class="row days">${days.map((name,i)=>`<label><input type="checkbox" name="dia" value="${i}" ${config.dias.includes(i)?'checked':''}>${name}</label>`).join('')}</div><div id="periodos" style="margin-top:18px">${config.periodos.map(periodEntry).join('')}</div><button id="add-periodo" type="button" class="secondary">Adicionar período</button><label style="margin-top:18px">Intervalo entre opções de horário (min)<input name="intervalo" type="number" value="${config.intervalo}" min="5" max="120" required></label><small>Exemplo: intervalo de 30 mostra 09:00, 09:30, 10:00… A duração do serviço e as reservas ocupadas são respeitadas.</small></div><button type="submit" id="salvar-config" class="wide">Salvar configurações</button></form>`;
document.getElementById('add-barbeiro').onclick=()=>{document.getElementById('profissionais').insertAdjacentHTML('beforeend',barberEntry({id:idNovo(),nome:''}));bindRemove();};document.getElementById('add-servico').onclick=()=>{document.getElementById('servicos').insertAdjacentHTML('beforeend',servicoEntry({id:idNovo(),nome:'',preco:30,duracao:30}));bindRemove();};document.getElementById('add-periodo').onclick=()=>{document.getElementById('periodos').insertAdjacentHTML('beforeend',periodEntry({inicio:'14:00',fim:'19:00'}));bindRemove();};bindRemove();
document.getElementById('config-form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('salvar-config');b.disabled=true;const f=e.target,field=(row,key)=>row.querySelector('[data-campo="'+key+'"]').value;const body={nome:f.nome.value,whatsapp:f.whatsapp.value,comissao:Number(f.comissao.value),intervalo:Number(f.intervalo.value),dias:[...f.querySelectorAll('[name="dia"]:checked')].map(x=>Number(x.value)),barbeiros:[...f.querySelectorAll('[data-barbeiro]')].map(r=>({id:r.dataset.barbeiro,nome:field(r,'nome'),whatsapp:field(r,'whatsapp')})),servicos:[...f.querySelectorAll('[data-servico]')].map(r=>({id:r.dataset.servico,nome:field(r,'nome'),preco:field(r,'preco'),duracao:Number(field(r,'duracao'))})),periodos:[...f.querySelectorAll('.periodo')].map(r=>({inicio:field(r,'inicio'),fim:field(r,'fim')}))};try{config=await api('/api/configuracao',{method:'PUT',body:JSON.stringify(body)});document.getElementById('nome-loja').textContent=config.nome;mensagem('Configurações salvas. Sua agenda pública já está atualizada.');}catch(err){mensagem(err.message,true);}finally{b.disabled=false;}};}

const dataAssinatura=v=>v?new Date(v).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'Ainda não ativada';
function renderAssinatura(){const a=assinaturaInfo;document.getElementById('assinatura-area').innerHTML=`<section class="card"><h2>Assinatura · R$ 90 por mês</h2><p>${a.cobranca_ativa?(a.ativa?'Agenda liberada':'Aguardando pagamento e ativação'):'Cobrança em preparação'}</p><p>Validade: ${esc(dataAssinatura(a.vencimento))}</p>${a.pix_chave?`<p>Chave Pix: <strong>${esc(a.pix_chave)}</strong></p><p>Titular: ${esc(a.pix_titular)}</p><button id="copiar-pix" class="secondary">Copiar chave Pix</button><p>Pague R$ 90 e envie o comprovante com o e-mail da sua conta. O pagamento será conferido antes da ativação por um mês.</p>${a.whatsapp?`<a class="button secondary" target="_blank" rel="noopener" href="${wa(a.whatsapp)}">Enviar comprovante no WhatsApp</a>`:''}`:'<p>Os dados de pagamento serão disponibilizados aqui pelo responsável pelo sistema.</p>'}<p class="muted">Não há débito automático. Após o vencimento, novos agendamentos ficam suspensos. Você continua acessando suas configurações e reservas.</p></section>`;const b=document.getElementById('copiar-pix');if(b)b.onclick=async()=>{try{await navigator.clipboard.writeText(a.pix_chave);mensagem('Chave Pix copiada. Confira o titular no aplicativo do banco antes de pagar.');}catch{mensagem('Copie a chave Pix exibida acima.');}};}
async function gestao(){sessao=await api('/api/sessao');csrf=sessao.csrf;const shops=await api('/api/gestao/barbearias');el.innerHTML=`<h1>Assinaturas das barbearias</h1><p>R$ 90 por mês. Confira o recebimento no banco antes de ativar.</p><p><a class="button secondary" href="/painel">Voltar ao meu painel</a></p><div>${shops.map(s=>`<section class="card"><h2>${esc(s.nome)}</h2><p>${esc(s.email)} · ${esc(s.slug)}</p><p>Situação: ${s.status==='ativa'?'Ativa':s.status==='vencida'?'Vencida':'Aguardando pagamento'}</p><p>Validade: ${esc(dataAssinatura(s.vencimento))}</p><form data-ativar="${esc(s.id)}"><label>Identificador do Pix recebido<input name="referencia" minlength="6" maxlength="100" required placeholder="Identificador da transação no banco"></label><label class="row"><input type="checkbox" required>Conferi o recebimento de R$ 90 no banco para esta barbearia.</label><button>Confirmar pagamento e liberar 1 mês</button></form></section>`).join('')||'<p>Nenhuma barbearia cadastrada.</p>'}</div>`;document.querySelectorAll('[data-ativar]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{await api('/api/gestao/barbearias/'+encodeURIComponent(f.dataset.ativar)+'/pagamentos',{method:'POST',body:JSON.stringify({referencia:f.elements.referencia.value})});await gestao();mensagem('Pagamento registrado. Um mês acrescentado à assinatura.');}catch(err){mensagem(err.message,true);b.disabled=false;}});}


async function painelBarbeiro(){const perfil=await api('/api/meu-perfil');reservas=await api('/api/agendamentos');el.innerHTML=`<div class="row between"><div><h1>Minha agenda</h1><p>${esc(perfil.profissional)} · ${esc(perfil.barbearia)}</p></div><button id="sair" class="secondary">Sair da conta</button></div>${!perfil.agenda_liberada?'<div class="notice">Novos agendamentos estão suspensos. Fale com o dono sobre a assinatura.</div>':''}<p class="muted">Aqui aparecem somente seus atendimentos. Cancelamentos e alterações de preços são feitos pelo dono.</p><div id="agenda-area"></div>`;document.getElementById('sair').onclick=async()=>{try{await api('/api/logout',{method:'POST'});location.href='/entrar';}catch(err){mensagem(err.message,true);}};renderAgenda();setInterval(async()=>{if(document.hidden)return;try{reservas=await api('/api/agendamentos');listaAgenda();}catch(err){if(err.status===401)location.replace('/entrar');}},30000);}
async function renderEquipe(){const rows=await api('/api/equipe');document.getElementById('equipe-area').innerHTML=`<h2>Acesso dos profissionais</h2><p>Primeiro cadastre os profissionais em Configurações e salve. Depois gere um convite. Cada profissional cria sua senha e vê apenas os próprios atendimentos.</p>${rows.map(r=>`<section class="card"><h3>${esc(r.nome)}</h3><p>${r.conta?.ativo?'Acesso ativo: '+esc(r.conta.email):'Sem acesso ativo'}${r.convite?'<br>Convite pendente: '+esc(r.convite.email):''}</p><form data-convidar="${esc(r.id)}"><label>E-mail do profissional<input name="email" type="email" required maxlength="150" value="${esc(r.conta?.email||r.convite?.email||'')}"></label><button>Gerar convite</button></form><div data-link-convite="${esc(r.id)}" class="hidden"></div>${r.conta?.ativo||r.convite?`<p><button class="danger" data-revogar="${esc(r.id)}">Revogar acesso e convites</button></p>`:''}</section>`).join('')||'<div class="card">Cadastre e salve pelo menos um profissional em Configurações.</div>'}`;document.querySelectorAll('[data-convidar]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const r=await api('/api/equipe/'+encodeURIComponent(f.dataset.convidar)+'/convite',{method:'POST',body:JSON.stringify({email:f.elements.email.value})});const box=document.querySelector('[data-link-convite="'+f.dataset.convidar+'"]');box.className='notice';const link=location.origin+r.link;box.innerHTML=`<p>Convite válido por 7 dias. Envie somente a este profissional. Um novo convite invalida o anterior.</p><input readonly aria-label="Link do convite" value="${esc(link)}"><button type="button" class="secondary">Copiar convite</button>`;box.querySelector('button').onclick=async()=>{try{await navigator.clipboard.writeText(link);mensagem('Convite copiado. Envie ao profissional por mensagem privada.');}catch{mensagem('Copie o link exibido.');}};}catch(err){mensagem(err.message,true);}finally{b.disabled=false;}});document.querySelectorAll('[data-revogar]').forEach(b=>b.onclick=async()=>{if(!confirm('Revogar o acesso deste profissional e seus convites? Ele só poderá entrar novamente com um novo convite.'))return;b.disabled=true;try{await api('/api/equipe/'+encodeURIComponent(b.dataset.revogar)+'/revogar',{method:'POST'});await renderEquipe();mensagem('Acesso revogado.');}catch(err){mensagem(err.message,true);b.disabled=false;}});}
async function aceitarConvite(){const token=location.hash.slice(1);if(!token)throw new Error('Abra o link completo do convite enviado pelo dono.');const info=await api('/api/convite/info',{method:'POST',body:JSON.stringify({token})});el.innerHTML=`<section class="card narrow"><h1>Seu acesso de barbeiro</h1><p>${esc(info.profissional)} · ${esc(info.barbearia)}</p><p>E-mail de acesso: <strong>${esc(info.email)}</strong></p><form id="aceitar-convite"><label>Crie sua senha<input name="senha" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><small>Pelo menos 10 caracteres.</small></label><label>Confirme a senha<input name="confirmacao" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><button class="wide">Criar meu acesso</button></form></section>`;document.getElementById('aceitar-convite').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');if(f.elements.senha.value!==f.elements.confirmacao.value){mensagem('As senhas precisam ser iguais.',true);return;}b.disabled=true;try{await api('/api/convite/aceitar',{method:'POST',body:JSON.stringify({token,senha:f.elements.senha.value})});location.replace('/painel');}catch(err){mensagem(err.message,true);b.disabled=false;}};}

async function iniciar(){const path=location.pathname;try{if(path==='/convite'){await aceitarConvite();}else if(path==='/gestao'){await gestao();}else if(path.startsWith('/b/')){slug=decodeURIComponent(path.slice(3));await booking();}else if(['/painel','/admin','/barbeiro'].includes(path)){await painel();}else if(path==='/cadastro'){acesso(true);}else if(path==='/entrar'){acesso();}else{inicio();}}catch(err){el.innerHTML='<div class="card"><h1>Não foi possível abrir esta página</h1><p id="erro-pagina"></p><a class="button secondary" href="/">Voltar ao início</a></div>';document.getElementById('erro-pagina').textContent=err.message;}}
iniciar();
</script></body></html>
