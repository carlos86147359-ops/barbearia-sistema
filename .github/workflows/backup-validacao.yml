name: Validar recuperacao de backup
on:
  push:
    branches: [main, codex/backup-diario]
    paths: ['app.py', 'backup_nuvem.py', 'restaurar_backup.py', 'recursos.py', 'tests/test_backup*.py', 'tests/test_cortesia.py', 'backup-publica.pem', '.github/workflows/backup*.yml']
  pull_request:
    paths: ['app.py', 'backup_nuvem.py', 'restaurar_backup.py', 'recursos.py', 'tests/test_backup*.py', 'tests/test_cortesia.py', 'backup-publica.pem', '.github/workflows/backup*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ensaio-local-descartavel
          POSTGRES_DB: ensaio_backup
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-backup.txt httpx
      - run: PYTHONPATH=. python tests/test_backup_nuvem.py
      - run: PYTHONPATH=. python tests/test_cortesia.py
      - name: Restaurar dados ficticios no PostgreSQL
        env:
          BACKUP_TEST_DATABASE_URL: postgresql://postgres:ensaio-local-descartavel@localhost:5432/ensaio_backup
        run: PYTHONPATH=. python tests/test_backup_postgres.py
