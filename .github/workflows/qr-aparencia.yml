name: Validar QR e aparencia
on:
  pull_request:
    paths: ['*.py', '*.html', '*.css', '*.js', 'requirements*.txt', 'tests/**', '.github/workflows/qr-aparencia.yml']
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-backup.txt httpx opencv-python-headless
      - name: Validar QR com decodificador independente
        env:
          QR_DECODE_TEST: '1'
        run: PYTHONPATH=. python tests/test_aparencia_qr.py
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Abrir servidor com banco temporario
        run: |
          BARBER_DB_PATH="$(mktemp -u /tmp/barber-qr-XXXXXX.db)" PUBLIC_BASE_URL=http://127.0.0.1:8788 BILLING_ENABLED=false uvicorn app:app --host 127.0.0.1 --port 8788 > /tmp/barber-qr-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/barber-qr-server.log
          exit 1
      - name: Testar temas e QR no navegador
        run: node tests/test_aparencia_qr_browser.cjs
      - name: Guardar capturas, PNG e cartaz PDF de teste
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qr-aparencia-evidencias
          path: test-results/
          retention-days: 7
