name: Validar QR e aparencia
on:
  push:
    branches: [main]
  pull_request:
    paths: ['*.py', '*.html', '*.css', '*.js', 'requirements*.txt', 'tests/**', '.github/workflows/qr-aparencia.yml']
permissions:
  contents: read
jobs:
  interface:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-backup.txt httpx opencv-python-headless
      - name: Validar QR com decodificador independente
        env:
          QR_DECODE_TEST: '1'
        run: PYTHONPATH=. python tests/test_aparencia_qr.py
      - name: Validar assinaturas e transacoes SQLite
        run: PYTHONPATH=. python tests/test_mensalistas.py
      - name: Validar Asaas Sandbox sem rede e sem credenciais reais
        run: PYTHONPATH=. python tests/test_cobranca_saas.py
      - name: Validar Asaas producao simulada sem rede
        run: PYTHONPATH=. python tests/test_cobranca_producao.py
      - name: Validar PIX mensal sem rede
        run: PYTHONPATH=. python tests/test_cobranca_pix.py
      - name: Validar promocoes e recebimentos em SQLite
        run: PYTHONPATH=. python tests/test_promocoes.py
      - name: Validar recuperacao de leitura sem repetir cobrancas
        run: node tests/test_api_recovery.cjs
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Abrir servidor com banco temporario
        run: |
          python gerar_chaves_push.py > /tmp/barber-test-push.env
          set -a
          . /tmp/barber-test-push.env
          set +a
          BARBER_DB_PATH="$(mktemp -u /tmp/barber-qr-XXXXXX.db)" PUBLIC_BASE_URL=http://127.0.0.1:8788 BILLING_ENABLED=false uvicorn app:app --host 127.0.0.1 --port 8788 > /tmp/barber-qr-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8788/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/barber-qr-server.log
          exit 1
      - name: Validar agenda existente, acesso da equipe e instalacao interna
        run: |
          PYTHONPATH=. python tests/test_fluxo.py
          PYTHONPATH=. python tests/test_equipe.py
          PYTHONPATH=. python tests/test_pwa.py
          node tests/test_frontend.cjs
      - name: Testar interface de cobranca e consentimento
        run: node tests/test_cobranca_browser.cjs
      - name: Testar central de notificacoes e experiencia mobile
        run: node tests/test_notificacoes_browser.cjs
      - name: Testar enquadramento e fotos dos profissionais
        run: |
          node tests/test_photo_crop.cjs
          node tests/test_photo_crop_browser.cjs
      - name: Testar agendamento publico sem instalacao ou acesso administrativo
        run: node tests/test_public_booking_browser.cjs
      - name: Testar promocoes, fluxo mobile, recebimento e temas
        run: node tests/test_promocoes_browser.cjs
      - name: Testar temas e QR no navegador
        run: node tests/test_aparencia_qr_browser.cjs
      - name: Testar assinaturas no navegador e no celular
        run: node tests/test_mensalistas_browser.cjs
      - name: Guardar capturas, PNG e cartaz PDF de teste
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qr-aparencia-evidencias
          path: test-results/
          retention-days: 7
  asaas-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: asaas-test-only
          POSTGRES_DB: asaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-backup.txt httpx
      - name: Validar cobranca Sandbox em PostgreSQL isolado
        env:
          TEST_ASAAS_DATABASE_URL: postgresql://postgres:asaas-test-only@127.0.0.1:5432/asaas_test
        run: PYTHONPATH=. python tests/test_cobranca_saas.py
      - name: Criar banco isolado para producao simulada
        run: python -c "import psycopg; psycopg.connect('postgresql://postgres:asaas-test-only@127.0.0.1:5432/asaas_test',autocommit=True).execute('CREATE DATABASE asaas_production_test')"
      - name: Validar producao simulada em PostgreSQL isolado
        env:
          TEST_ASAAS_DATABASE_URL: postgresql://postgres:asaas-test-only@127.0.0.1:5432/asaas_production_test
        run: PYTHONPATH=. python tests/test_cobranca_producao.py
      - name: Criar banco isolado para PIX
        run: python -c "import psycopg; psycopg.connect('postgresql://postgres:asaas-test-only@127.0.0.1:5432/asaas_test',autocommit=True).execute('CREATE DATABASE asaas_pix_test')"
      - name: Validar PIX em PostgreSQL isolado
        env:
          TEST_ASAAS_DATABASE_URL: postgresql://postgres:asaas-test-only@127.0.0.1:5432/asaas_pix_test
        run: PYTHONPATH=. python tests/test_cobranca_pix.py
  publicacao:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Conferir atualizacao publicada no Render sem alterar dados
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          base = 'https://barbearia-sistema-rj6p.onrender.com'
          def read(path):
              req = Request(base + path, headers={'Cache-Control': 'no-cache', 'User-Agent': 'BarberSaaS-Deploy-Check'})
              try:
                  with urlopen(req, timeout=20) as response:
                      return response.status, response.read()
              except HTTPError as e:
                  return e.code, b''
          def check():
              status, body = read('/health')
              assert status == 200, 'health: ' + str(status)
              for asset in ['appearance.js', 'appearance.css', 'image-upload.js', 'design-system.js', 'panel-ux.js', 'mensalistas.js', 'mensalistas.css', 'produtos.js', 'pwa.js', 'workspace.css', 'notifications.js', 'sw.js', 'promocoes.js', 'promocoes.css']:
                  status, body = read('/' + asset)
                  assert status == 200, asset + ': ' + str(status)
                  expected = Path(asset).read_text(encoding='utf-8').encode('utf-8') if asset == 'sw.js' else Path(asset).read_bytes()
                  assert hashlib.sha256(body).digest() == hashlib.sha256(expected).digest(), asset + ': versao anterior'
              status, body = read('/b/barbearia')
              assert status == 200, 'pagina publica: ' + str(status)
              html = body.decode('utf-8')
              assert 'data-public-booking="true"' in html and '<section id="instalacao-app"' not in html and '<link rel="manifest"' not in html, 'pagina publica desatualizada'
              header = html.split('<header>', 1)[1].split('</header>', 1)[0]
              assert '/painel' not in header and 'Área da barbearia' not in header, 'acesso interno no cabecalho publico'
              status, body = read('/entrar')
              assert status == 200 and b'/appearance.js' in body and b'/appearance.css' in body, 'tela de login desatualizada'
              for path in ['/api/aparencia', '/api/qr-agendamento', '/api/qr-agendamento.png', '/qr-agendamento/imprimir', '/api/mensalistas/planos', '/api/mensalistas/assinantes', '/api/mensalistas/dashboard', '/api/notificacoes', '/api/notificacoes/config', '/api/promocoes', '/api/promocoes/relatorio']:
                  status, _ = read(path)
                  assert status == 401, path + ': ' + str(status)
          for attempt in range(1, 31):
              try:
                  check()
                  print('OK: versao publicada, health, login, temas e rotas administrativas protegidas.', flush=True)
                  break
              except Exception as e:
                  print('Aguardando publicacao (' + str(attempt) + '/30): ' + str(e), flush=True)
                  if attempt == 30:
                      raise
                  time.sleep(20)
          PY
