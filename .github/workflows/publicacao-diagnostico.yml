name: Diagnosticar publicacao de notificacoes
on:
  push:
    branches: [feat/notificacoes-web-push]
    paths: [.github/workflows/publicacao-diagnostico.yml]
permissions:
  contents: read
jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ler saude, versao e protecao das novas rotas
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          import hashlib
          from pathlib import Path
          base='https://barbearia-sistema-rj6p.onrender.com'
          for path in ['/health','/notifications.js','/sw.js','/appearance.js','/appearance.css','/image-upload.js','/design-system.js','/panel-ux.js','/mensalistas.js','/mensalistas.css','/produtos.js','/pwa.js','/workspace.css','/b/barbearia','/entrar','/api/notificacoes/config']:
              try:
                  with urlopen(Request(base+path,headers={'User-Agent':'Barber-Deployment-Diagnostic','Cache-Control':'no-cache'}),timeout=20) as r:
                      body=r.read()
                      print(path,'HTTP',r.status,'bytes',len(body),'sha256',hashlib.sha256(body).hexdigest(),flush=True)
                      if path=='/health':print(body.decode('utf8')[:200],flush=True)
                      if Path(path[1:]).is_file():print('MATCH',path,body==Path(path[1:]).read_bytes(),flush=True)
                      if path=='/b/barbearia':
                          html=body.decode('utf8')
                          print('PUBLIC', 'data-public-booking="true"' in html,'<section id="instalacao-app"' not in html,'<link rel="manifest"' not in html,flush=True)
              except HTTPError as e:print(path,'HTTP',e.code,flush=True)
              except Exception as e:print(path,type(e).__name__,flush=True)
          PY
